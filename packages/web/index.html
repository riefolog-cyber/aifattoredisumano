		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Course",
				"name": "Il Fattore Umano — Il pensiero resta tuo",
				"description": "Percorso didattico interattivo su intelligenza artificiale, cognizione e autonomia del pensiero.",

					}

			}

		<script>
			(function () {
				try {
					var stored = JSON.parse(localStorage.getItem("fd-theme") || "null");
					var theme =
						stored === "light" || stored === "dark"
							? stored
							: window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
								? "light"
								: "dark";
					document.documentElement.dataset.theme = theme;
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute("content", theme === "light" ? "#f6f4ea" : "#11191d");
				} catch (error) {
					document.documentElement.dataset.theme = "dark";
				}
			})();
		</script>
